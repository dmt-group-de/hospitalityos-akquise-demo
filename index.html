<style>
  /* ================================================================
     HospitalityOS · Zielkunden- und Termin-Assistent · Prototyp
     Farbwelt nach der Markenspezifikation, tiefes Anthrazit als Grund,
     warmes Gold als Akzent, Weiss fuer Text.
     Eine einzige Datei, keine fremden Bibliotheken, laeuft auch offline.
     ================================================================ */
  :root {
    --anthrazit: #141619;
    --anthrazit-tief: #0e1013;
    --gold: #d2a443;
    --gold-tief: #a87f2c;
    --elfenbein: #faf8f3;
    --weiss: #ffffff;
    --text: #23252a;
    --text-leise: #61656e;
    --linie: #e6e2d8;
    --gruen: #2f6b4f;
    --gruen-hell: #eef6f1;
    --rot: #a33a32;
    --rot-hell: #fdf0ef;
    --gelb-hell: #fdf8ee;
    --lila: #6b4a86;
    --lila-hell: #f3eef8;
    --schatten: 0 1px 2px rgba(20,22,25,.06), 0 8px 24px rgba(20,22,25,.05);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--elfenbein); color: var(--text);
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-weight: 700; line-height: 1.25; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: var(--gold-tief); }
  ul { list-style: none; }

  /* ---------------------------------------------------------- Geruest
     Die Seitenleiste ist NICHT fest breit. Eine feste Leiste verdraengt
     auf schmalen Bildschirmen den Inhalt und macht ihn unerreichbar.
     Deshalb wandert sie unterhalb von 900px nach oben. */
  .app { display: flex; min-height: 100%; }
  .nav {
    width: 258px; flex: 0 0 258px; background: var(--anthrazit);
    display: flex; flex-direction: column; gap: 24px; padding: 22px 16px;
  }
  .marke { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
  .monogramm {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 9px;
    background: linear-gradient(150deg, #1d2026, #101216);
    border: 1px solid rgba(210,164,67,.35);
    display: grid; place-items: center;
    font-family: Georgia, "Times New Roman", serif; font-size: 21px;
    font-weight: 700; color: var(--gold);
  }
  .marke-text { display: flex; flex-direction: column; min-width: 0; }
  .marke-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: .01em; }
  .marke-sub { font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
               text-transform: uppercase; color: var(--gold); }
  .nav-gruppe { display: flex; flex-direction: column; gap: 3px; }
  .nav-titel { font-size: 10px; font-weight: 800; letter-spacing: .15em;
               text-transform: uppercase; color: rgba(255,255,255,.34);
               padding: 0 12px 5px; }
  .nav-punkt {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 10px 12px; border-radius: 9px; min-height: 44px;
    color: rgba(255,255,255,.68); font-size: 14.5px; text-align: left;
  }
  .nav-punkt:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-punkt[aria-current="page"] { background: rgba(210,164,67,.14); color: #fff; font-weight: 600; }
  .nav-punkt[aria-current="page"] .nav-icon { color: var(--gold); }
  .nav-icon { width: 19px; flex: 0 0 19px; text-align: center; color: rgba(255,255,255,.5); }
  .nav-zahl {
    margin-left: auto; font-size: 12px; font-weight: 700; padding: 1px 8px;
    border-radius: 999px; background: rgba(210,164,67,.18); color: var(--gold);
  }
  .nav-fuss { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
  .nav-hinweis {
    background: rgba(255,255,255,.05); border-radius: 10px; padding: 12px 13px;
    font-size: 12.5px; line-height: 1.5; color: rgba(255,255,255,.62);
  }
  .nav-hinweis b { color: rgba(255,255,255,.9); }
  .nutzer { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .nutzer-kreis {
    width: 34px; height: 34px; flex: 0 0 34px; border-radius: 999px;
    background: var(--gold); color: var(--anthrazit);
    display: grid; place-items: center; font-size: 12.5px; font-weight: 800;
  }
  .nutzer-name { font-size: 13.5px; font-weight: 600; color: #fff; }
  .nutzer-rolle { font-size: 11.5px; color: rgba(255,255,255,.5); }

  .inhalt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .kopf {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 18px 26px; background: var(--weiss); border-bottom: 1px solid var(--linie);
  }
  .kopf-text { min-width: 0; flex: 1; }
  .kopf-kicker { font-size: 11px; font-weight: 700; letter-spacing: .13em;
                 text-transform: uppercase; color: var(--gold-tief); }
  .kopf-titel { font-size: 21px; }
  .bahn { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 26px 60px; }

  /* Der Betriebs-Umschalter. Er ist der Grund, warum derselbe Link bei
     drei sehr verschiedenen Haeusern gezeigt werden kann. */
  .umschalter { display: flex; gap: 4px; background: #f2f1ed; padding: 4px;
                border-radius: 999px; flex-wrap: wrap; }
  .umschalter button { padding: 7px 14px; border-radius: 999px; font-size: 13px;
                       font-weight: 600; color: var(--text-leise); min-height: 36px; }
  .umschalter button[aria-pressed="true"] { background: var(--anthrazit); color: #fff; }

  /* ------------------------------------------------------------ Bausteine */
  .karte { background: var(--weiss); border: 1px solid var(--linie);
           border-radius: var(--radius); box-shadow: var(--schatten); }
  .karte-kopf { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
                padding: 15px 18px; border-bottom: 1px solid var(--linie); }
  .karte-titel { font-size: 15.5px; }
  .karte-leib { padding: 16px 18px; }
  .gitter { display: grid; gap: 14px; }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-haupt { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; }
  .stapel { display: flex; flex-direction: column; gap: 14px; }
  .reihe { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .kennzahl { background: var(--weiss); border: 1px solid var(--linie);
              border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--schatten); }
  .kennzahl-label { font-size: 11px; font-weight: 700; letter-spacing: .1em;
                    text-transform: uppercase; color: var(--text-leise); }
  .kennzahl-wert { font-size: 30px; font-weight: 800; line-height: 1.15; margin-top: 4px;

  .kennzahl-note { font-size: 12.5px; color: var(--text-leise); margin-top: 2px; }
  .kennzahl-note.gut { color: var(--gruen); font-weight: 600; }
  .kennzahl-note.warn { color: var(--rot); font-weight: 600; }

  .pille { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
           border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .p-gold { background: rgba(210,164,67,.16); color: var(--gold-tief); }
  .p-gruen { background: var(--gruen-hell); color: var(--gruen); }
  .p-rot { background: var(--rot-hell); color: var(--rot); }
  .p-grau { background: #f0f0ee; color: var(--text-leise); }
  .p-lila { background: var(--lila-hell); color: var(--lila); }

  /* Die Farbkodierung stammt aus der Akquiseliste des Hauses. Sie ist das
     Statusfeld des Assistenten und wurde nicht neu erfunden, sondern
     uebernommen. */
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px;
            font-weight: 600; white-space: nowrap; }
  .status-punkt { width: 11px; height: 11px; flex: 0 0 11px; border-radius: 999px;
                  border: 1px solid rgba(20,22,25,.25); }
  .s-weiss   { background: #ffffff; }
  .s-dunkelgruen { background: #1f5c3d; border-color: #1f5c3d; }
  .s-hellgruen   { background: #86c8a3; border-color: #6aad88; }
  .s-grau    { background: #b9b9b2; border-color: #a3a39c; }
  .s-lila    { background: #6b4a86; border-color: #6b4a86; }

  .knopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
           padding: 11px 18px; border-radius: 9px; font-size: 14.5px; font-weight: 700;
           min-height: 44px; border: 1px solid transparent; }
  .k-gold { background: var(--gold); color: #1a1a1a; }
  .k-gold:hover { background: var(--gold-tief); color: #fff; }
  .k-dunkel { background: var(--anthrazit); color: #fff; }
  .k-dunkel:hover { background: #23262c; }
  .k-rand { border-color: var(--linie); background: var(--weiss); }
  .k-rand:hover { border-color: var(--gold); }
  .k-still { color: var(--text-leise); }
  .k-still:hover { color: var(--text); }
  .k-klein { padding: 7px 12px; min-height: 36px; font-size: 13px; }
  .knopf[disabled] { opacity: .45; cursor: not-allowed; }

  .feld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .feld-label { font-size: 11px; font-weight: 700; letter-spacing: .09em;
                text-transform: uppercase; color: var(--text-leise); }
  .feld input, .feld textarea, .feld select {
    font: inherit; width: 100%; padding: 9px 11px; border: 1px solid var(--linie);
    border-radius: 8px; background: var(--weiss); color: var(--text); min-height: 42px;
  }
  .feld textarea { min-height: 84px; resize: vertical; }
  .feld input:focus, .feld textarea:focus, .feld select:focus {
    outline: 2px solid rgba(210,164,67,.5); outline-offset: 1px; border-color: var(--gold); }

  .beleg { font-size: 12px; color: var(--text-leise); display: flex; gap: 6px;
           align-items: baseline; flex-wrap: wrap; }
  .beleg-zitat { font-style: italic; overflow-wrap: anywhere; }

  .kasten { border-radius: 10px; padding: 13px 15px; border-left: 4px solid; }
  .kasten-titel { font-size: 11px; font-weight: 800; letter-spacing: .11em;
                  text-transform: uppercase; margin-bottom: 5px; }
  .kasten-text { font-size: 13.5px; line-height: 1.55; }
  .kasten.gold { background: var(--gelb-hell); border-color: var(--gold); }
  .kasten.gold .kasten-titel { color: var(--gold-tief); }
  .kasten.rot { background: var(--rot-hell); border-color: var(--rot); }
  .kasten.rot .kasten-titel { color: var(--rot); }
  .kasten.gruen { background: var(--gruen-hell); border-color: var(--gruen); }
  .kasten.gruen .kasten-titel { color: var(--gruen); }
  .kasten.grau { background: #f5f5f3; border-color: #b9b9b2; }
  .kasten.grau .kasten-titel { color: var(--text-leise); }

  /* Tabellen duerfen waagerecht scrollen. Ein abgeschnittener Rahmen ist
     ein stiller Verlust, ein scrollbarer ist Absicht. Ohne das faellt auf
     schmalen Bildschirmen die letzte Spalte ersatzlos weg. */
  .tabelle-rahmen { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .09em;
       text-transform: uppercase; color: var(--text-leise);
       padding: 9px 14px; border-bottom: 1px solid var(--linie); white-space: nowrap; }
  td { padding: 12px 14px; border-bottom: 1px solid var(--linie); font-size: 14px;
       vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.klickbar:hover { background: var(--gelb-hell); cursor: pointer; }
  .zahl { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rechts { text-align: right; }
  .breit { overflow-wrap: anywhere; }

  .liste-zeile { display: flex; align-items: center; gap: 14px; padding: 13px 18px;
                 border-bottom: 1px solid var(--linie); width: 100%; text-align: left;
                 min-height: 44px; }
  .liste-zeile:last-child { border-bottom: 0; }
  .liste-zeile:hover { background: var(--gelb-hell); }
  .kanal { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 9px;
           display: grid; place-items: center; font-size: 15px; background: #f2f1ed; }
  /* Die beiden Zeilen muessen BLOCK sein, sonst laufen sie inline
     zusammen und lassen sich auf schmalen Bildschirmen nicht umbrechen.
     Dazu `overflow-wrap`, weil deutsche Komposita wie
     „Fuehrungskraeftetagung" sonst als ein unteilbares Wort stehen
     bleiben und den Rahmen sprengen. */
  .liste-haupt { min-width: 0; flex: 1; }
  .liste-titel { display: block; font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
  .liste-sub { display: block; font-size: 12.5px; color: var(--text-leise); overflow-wrap: anywhere; }
  .liste-rechts { text-align: right; display: flex; flex-direction: column;
                  gap: 3px; align-items: flex-end; flex-shrink: 0; }

  .schritte { display: flex; gap: 8px; flex-wrap: wrap; }
  .schritt { display: flex; align-items: center; gap: 8px; padding: 7px 13px;
             border-radius: 999px; background: #f2f1ed; font-size: 12.5px;
             font-weight: 600; color: var(--text-leise); }
  .schritt.aktiv { background: var(--anthrazit); color: #fff; }
  .schritt.fertig { background: var(--gruen-hell); color: var(--gruen); }

  .reiter { display: flex; gap: 4px; flex-wrap: wrap; }
  .reiter button { padding: 8px 14px; border-radius: 8px; font-size: 13.5px;
                   font-weight: 600; color: var(--text-leise); min-height: 40px; }
  .reiter button[aria-selected="true"] { background: var(--anthrazit); color: #fff; }

  .opener { background: var(--gelb-hell); border: 1px solid rgba(210,164,67,.4);
            border-radius: 10px; padding: 15px 17px; font-size: 15px; line-height: 1.65;
            white-space: pre-wrap; overflow-wrap: anywhere; }

  /* Schalter. Bewusst gross genug fuer den Daumen, 44 Pixel Hoehe in
     der Zeile, damit die Anwendung auch auf dem Handy bedienbar ist. */
  .schalter-zeile { display: flex; gap: 13px; align-items: flex-start;
                    padding: 11px 0; border-bottom: 1px solid var(--linie); }
  .schalter-zeile:last-child { border-bottom: 0; }
  .schalter { width: 46px; height: 27px; flex: 0 0 46px; border-radius: 999px;
              background: #d8d6cf; position: relative; transition: background .15s;
              margin-top: 2px; }
  .schalter[aria-checked="true"] { background: var(--gruen); }
  .schalter-knopf { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px;
                    border-radius: 999px; background: #fff; transition: left .15s;
                    box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .schalter[aria-checked="true"] .schalter-knopf { left: 22px; }
  .schalter:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .schalter-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .schalter-text b { font-size: 14.5px; }
  .schalter-text span { font-size: 13px; color: var(--text-leise); }

  .marke-pille { display: inline-flex; align-items: center; gap: 7px; padding: 6px 8px 6px 13px;
                 border-radius: 999px; background: rgba(210,164,67,.16); color: var(--gold-tief);
                 font-size: 13px; font-weight: 700; }
  .marke-pille button { width: 22px; height: 22px; border-radius: 999px; font-size: 12px;
                        color: var(--gold-tief); background: rgba(255,255,255,.7); }
  .marke-pille button:hover { background: #fff; color: var(--rot); }

  .fuss { padding: 18px 26px 26px; color: var(--text-leise); font-size: 12px;
          border-top: 1px solid var(--linie); background: var(--weiss); }

  /* ------------------------------------------------------------- Schmal
     Ab hier wandert die Navigation nach oben. Nichts wird abgeschnitten,
     alles bleibt erreichbar. */
  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .nav { width: 100%; flex: none; flex-direction: row; align-items: center;
           gap: 12px; padding: 12px 14px; overflow-x: auto; }
    .marke { flex: 0 0 auto; padding: 0; }
    .marke-text { display: none; }
    .nav-gruppe { flex-direction: row; gap: 4px; }
    .nav-titel { display: none; }
    .nav-punkt { padding: 9px 12px; white-space: nowrap; }
    .nav-icon { display: none; }
    .nav-fuss { display: none; }
    .kopf, .bahn, .fuss { padding-left: 16px; padding-right: 16px; }
    .g4, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g2, .g-haupt { grid-template-columns: minmax(0, 1fr); }
    .kennzahl-wert { font-size: 25px; }
  }
  @media (max-width: 480px) {
    .g4, .g3 { grid-template-columns: minmax(0, 1fr); }
    .kopf-titel { font-size: 18px; }
  }
</style>

<script>
/* ==================================================================
   HospitalityOS · Zielkunden- und Termin-Assistent · Prototyp
   ------------------------------------------------------------------
   WAS DAS IST
     Ein klickbarer Prototyp, kein Produkt. Alle Haeuser, Firmen,
     Personen und Zahlen sind erfunden. Es geht ausschliesslich um den
     Ablauf und um die Bedienung.

   DIE ZWEI ASSISTENTEN
     Zielkunden-Assistent   findet und selektiert Haeuser, und legt
                            offen, was er verworfen hat und warum.
     Termin-Assistent       fuehrt die Liste, formuliert den Einstieg,
                            begleitet das Telefonat und schreibt das
                            Ergebnis zurueck.
     Sie bleiben getrennt, weil genau diese Trennung den Selektions-
     schritt als PRUEFBARE Stufe erhaelt.

   WAS DIESER PROTOTYP BEWUSST ANDERS MACHT
     Jeder Punkt hat einen Grund, und der steht dabei.
     1. Die Selektion ist pruefbar. Jede verworfene Firma steht mit
        Namen, verletztem Kriterium und Beleg da, und laesst sich mit
        einem Klick ueberstimmen.
     2. Jede Angabe traegt ihre Quelle und ihr Abrufdatum.
     3. Die Anrede wird NIE aus dem Vornamen erraten. Ist sie nicht
        belegt, formuliert der Assistent ohne Anrede.
     4. Es gibt keine Obergrenze bei der Firmengroesse. Grosse Haeuser
        sind ausdruecklich das Ziel.
     5. Reine Tagungen sind ein Ausschlusskriterium.
     6. Die Interessenten-Ebene ist da, per Klick wird aus dem
        Interessenten ein Kunde.
     7. Die Statuslogik ist die uebernommene Farbkodierung aus der
        Akquiseliste, keine neu erfundene.
     8. Rufnummern stehen im internationalen Format, sonst baut die
        Telefonanlage die Verbindung nicht auf.

   UMBAU AUF EINEN ECHTEN BETRIEB
     Nur den Block BETRIEBE anfassen. Alles andere bleibt.
   ================================================================== */

/* ------------------------------------------------------------------
   Guete einer Angabe.
   belegt     = steht woertlich in der genannten Quelle
   abgeleitet = aus der Quelle geschlossen, plausibel, nicht gesagt
   fehlt      = steht nirgends, wird nicht geraten
   ------------------------------------------------------------------ */

const BETRIEBE = {

  /* ============================================================ 1 */
  stern: {
    schluessel: 'stern',
    reiter: 'Sternerestaurant',
    haus: 'Haus Kranichstein',
    zusatz: 'Fine Dining mit zwei Veranstaltungsräumen',
    ort: 'Hamburg, Elbvororte',
    nutzer: 'Marek Sanders',
    rolle: 'Vertrieb und Veranstaltungen',
    regeln: {
      radiusMin: 30, mindestGroesse: 20, obergrenzeAn: false, obergrenze: 500,
      anlassPflicht: false,
      anlaesse: ['Kundendinner', 'Weihnachtsfeier', 'Sommerfest', 'Jubiläum', 'Abteilungsessen'],
      schalter: { liquidation: true, dublette: true, zweitstandort: true, tagung: true, eigenversorger: true }
    },
    schalter: [
      { schluessel: 'tagung', regel: 'Reine Tagungen, das ist ausdrücklich nicht unsere Kernkompetenz', grund: 'Reines Tagungsgeschäft' },
      { schluessel: 'eigenversorger', regel: 'Häuser mit eigener Gastronomie, sie feiern bei sich selbst', grund: 'Eigene Gastronomie im Haus' },
      { schluessel: 'liquidation', regel: 'Firmen in Liquidation oder ohne aktiven Handelsregistereintrag', grund: 'In Liquidation' },
      { schluessel: 'dublette', regel: 'Filialen und Zweitmarken derselben Gesellschaft, nur einmal ansprechen', grund: 'Dublette' },
      { schluessel: 'zweitstandort', regel: 'Zweitstandorte, deren Entscheidung nachweislich in der Zentrale liegt', grund: 'Entscheidung liegt in der Zentrale' }

  dunkelgruen: { text: 'Zuerst bearbeiten',      klasse: 's-dunkelgruen' },

/* Kopie der Telefon-Einstellungen eines Betriebs. Jeder Einwand traegt
   sein eigenes `aktiv`, damit er abgeschaltet werden kann, ohne aus der
   Liste zu verschwinden. Ein geloeschter Einwand waere nicht
   wiederherstellbar, ein abgeschalteter ist es mit einem Klick. */
function telefonKopie(schluessel) {
  const o = BETRIEBE[schluessel];
  return {
    nutzer: o.nutzer,
    rolle: o.rolle,
    schluss: o.schluss,
    einwaende: o.einwaende.map(x => ({ frage: x.frage, antwort: x.antwort, aktiv: true, eigen: false }))
  };
}

/* Das Kuerzel im Seitenkopf wird aus dem Namen GERECHNET, nicht
   hinterlegt. Sonst stuende nach dem Umbenennen des Anrufers weiter das
   alte Kuerzel daneben, also dieselbe Angabe an zwei Stellen mit zwei
   verschiedenen Wahrheiten. */
function kuerzel(name) {
  const teile = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!teile.length) return '··';
  if (teile.length === 1) return teile[0].slice(0, 2).toUpperCase();
  return (teile[0][0] + teile[teile.length - 1][0]).toUpperCase();
}

/* ------------------------------------------------------------------
   Zustand. Bewusst klein gehalten, der Prototyp speichert nichts.
   ------------------------------------------------------------------ */
const zustand = {
  betrieb: 'stern',
  ansicht: 'uebersicht',
  reiterLauf: 'aufgenommen',
  kontaktId: null,
  anrufSchritt: 0,
  anrufErgebnis: '',
  /* Laufzeit-Aenderungen je Betrieb, damit ein Wechsel nichts verliert. */
  aenderungen: { stern: {}, tagung: {}, gruppe: {} },
  ueberstimmt: { stern: [], tagung: [], gruppe: [] },
  verworfeneNuggets: { stern: [], tagung: [], gruppe: [] },
  /* Die EINSTELLBAREN Regeln, je Betrieb eine eigene Kopie der
     hinterlegten. Die Vorlage in BETRIEBE bleibt unangetastet, sonst
     gaebe es kein „auf Standard zuruecksetzen" mehr. */
  regeln: {
    stern: JSON.parse(JSON.stringify(BETRIEBE.stern.regeln)),
    tagung: JSON.parse(JSON.stringify(BETRIEBE.tagung.regeln)),
    gruppe: JSON.parse(JSON.stringify(BETRIEBE.gruppe.regeln))
  },
  /* Dasselbe fuer den Termin-Assistenten. Anrufer, Schlusssatz und die
     Einwaende sind einstellbar, deshalb sind sie ab hier Zustand und
     werden nicht mehr direkt aus BETRIEBE gelesen. */
  telefon: {
    stern: telefonKopie('stern'),
    tagung: telefonKopie('tagung'),
    gruppe: telefonKopie('gruppe')
  },
  /* Die halbfertige Eingabe eines neuen Einwands. Sie liegt im Zustand,
     damit ein Neuzeichnen sie nicht verschluckt, und JE BETRIEB, wie
     jeder andere Laufzeitwert hier. Lag sie global, stand ein in einem
     Haus getippter Entwurf beim naechsten Haus im Feld und wurde dort
     als dessen Einwand gespeichert. */
  neuEinwand: {
    stern: { frage: '', antwort: '' },
    tagung: { frage: '', antwort: '' },
    gruppe: { frage: '', antwort: '' }
  },
  meldung: null,
  /* `gut` ist eine Erledigung, `stop` eine Ablehnung. Ohne diese
     Unterscheidung stuende „Erledigt" in Gruen ueber einem Satz, der
     gerade erklaert, dass nichts uebernommen wurde. */
  meldungArt: 'gut'
};

function b() { return BETRIEBE[zustand.betrieb]; }
function regeln() { return zustand.regeln[zustand.betrieb]; }
function tel() { return zustand.telefon[zustand.betrieb]; }
function neuEinwand() { return zustand.neuEinwand[zustand.betrieb]; }

/* Nur die aktiven Einwaende, in ihrer Reihenfolge. Eine einzige Stelle,
   damit Anrufansicht und Zaehlung nie auseinanderlaufen koennen. */
function aktiveEinwaende() { return tel().einwaende.filter(x => x.aktiv); }

/* Der Lauf, wie er mit den HINTERLEGTEN Regeln ausgesehen haette.
   Nur zum Vergleich, er veraendert nichts. */
function standardLauf() {
  const eigene = zustand.regeln[zustand.betrieb];
  zustand.regeln[zustand.betrieb] = b().regeln;
  const x = lauf();
  zustand.regeln[zustand.betrieb] = eigene;
  return x;
}

/* Ein Kontakt mit allen Laufzeit-Aenderungen darueber gelegt. */
function kontakte() {
  const aend = zustand.aenderungen[zustand.betrieb];
  return b().kontakte.map(k => Object.assign({}, k, aend[k.id] || {}));
}
function kontakt(id) { return kontakte().find(k => k.id === id); }

function aendere(id, feld, wert) {
  const aend = zustand.aenderungen[zustand.betrieb];
  if (!aend[id]) aend[id] = {};
  aend[id][feld] = wert;
}

/* ------------------------------------------------------------------
   Textbausteine. Hier entscheidet sich, ob der Prototyp ehrlich ist.
   ------------------------------------------------------------------ */

/* Die Anrede wird NIE aus dem Vornamen geschlossen. Ist sie nicht
   belegt, wird ohne Anrede formuliert. Wer sie aus dem letzten Buchstaben
   des Vornamens ableitet, spricht Luca, Sascha, Nikita, Joshua, Alexis
   und Kim verlaesslich falsch an. */
function anredeZeile(k) {
  if (k.anredeBelegt && k.anrede) return 'Guten Tag, ' + k.anrede + ' ' + nachname(k.person) + ',';
  return 'Guten Tag,';
}
function nachname(voll) {
  const teile = voll.split(' ');
  return teile[teile.length - 1];
}

/* Der gesprochene Einstieg entsteht NUR aus `einstieg`, nie aus `notiz`.
   Die Notiz ist die interne Begruendung und gehoert dem Anrufer, nicht
   dem Angerufenen. Lagen beide im selben Feld, liest der Assistent dem
   Kunden Saetze wie „Bestandskunde." und „Kein belegter Anlass." vor. */
function opener(k) {
  const o = b();
  if (!k.einstieg) return null;
  return anredeZeile(k) + '\n\n'
    + 'mein Name ist ' + tel().nutzer + ' vom ' + o.haus + '. '
    + k.einstieg + '\n\n'
    + tel().schluss + ' '
    + 'Passt es Ihnen kurz, oder rufe ich zu einem besseren Zeitpunkt noch einmal an?';
}

/* Statt eines erfundenen Einstiegs sagt der Assistent, was ihm fehlt. */
function openerBlock(k) {
  const t = opener(k);
  if (t) return '<div class="opener">' + e(t) + '</div>';
  return '<div class="kasten rot"><div class="kasten-titel">Kein Einstieg vorgeschlagen</div>'
    + '<div class="kasten-text">Für diesen Kontakt ist kein Veranstaltungsanlass belegt. '
    + 'Der Assistent erfindet keinen, sondern legt den Kontakt zurück. '
    + 'Wer trotzdem anrufen will, tut das ohne vorbereiteten Einstieg.</div></div>';
}

/* ------------------------------------------------------------------
   Bausteine der Oberflaeche
   ------------------------------------------------------------------ */
const e = (s) => String(s === undefined || s === null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

function statusPille(s) {
  const st = STATUS_TEXT[s];
  return '<span class="status"><span class="status-punkt ' + st.klasse + '"></span>' + e(st.text) + '</span>';
}

function guetePille(g) {
  if (g === 'belegt') return '<span class="pille p-gruen">belegt</span>';
  if (g === 'abgeleitet') return '<span class="pille p-gold">abgeleitet</span>';
  return '<span class="pille p-rot">fehlt</span>';
}

function ebenePille(k) {
  return k.ebene === 'Kunde'
    ? '<span class="pille p-lila">Kunde</span>'
    : '<span class="pille p-grau">Interessent</span>';
}

/* ------------------------------------------------------------------
   Die Selektion wird GERECHNET, nicht hinterlegt.
   Jede Firma traegt Merkmale, jede Regel ist einstellbar, und wer eine
   Regel aendert, sieht die Liste sofort anders. Das ist der ganze Zweck
   des Bildschirms „Assistenten anlernen". Eine Einstellung ohne Wirkung
   waere schlimmer als gar keine, weil sie Wirkung verspricht.
   ------------------------------------------------------------------ */

/* Reihenfolge der Pruefung. Sie bestimmt, WELCHER Grund angezeigt wird,
   wenn eine Firma mehrere Regeln verletzt. Harte Ausschluesse zuerst,
   danach die Zahlen, zuletzt die inhaltlichen Fragen. */
const PRUEF_REIHE = ['liquidation', 'dublette', 'zweitstandort', 'tagung',
                     'eigenversorger', 'keinBudget', 'kleinveranstaltung'];

function pruefe(f, o, r) {
  for (const k of PRUEF_REIHE) {
    if (r.schalter[k] && f.merkmale[k]) {
      const def = o.schalter.find(x => x.schluessel === k);
      return { grund: def.grund, kriterium: def.regel, beleg: f.merkmale[k] };
    }
  }
  if (f.fahrzeit > r.radiusMin) {
    return { grund: f.fahrzeit + ' Minuten Fahrzeit',
             kriterium: 'Einzugsgebiet ' + r.radiusMin + ' Minuten',
             beleg: 'Routenberechnung ab dem Haus, Ziel ' + f.ort };
  }
  if (f.mitarbeiter < r.mindestGroesse) {
    return { grund: f.mitarbeiter + ' Mitarbeitende',
             kriterium: 'Mindestgröße ' + r.mindestGroesse + ' Mitarbeitende',
             beleg: f.quelle + ', abgerufen ' + f.abruf };
  }
  if (r.obergrenzeAn && f.mitarbeiter > r.obergrenze) {
    return { grund: f.mitarbeiter + ' Mitarbeitende',
             kriterium: 'Obergrenze ' + r.obergrenze + ' Mitarbeitende',
             beleg: f.quelle + ', abgerufen ' + f.abruf };
  }
  if (r.anlassPflicht && f.guete === 'fehlt') {
    return { grund: 'Kein Veranstaltungsanlass belegt',
             kriterium: 'Belegter Anlass ist Pflicht',
             beleg: 'Keine Quelle nennt einen Anlass' };
  }
  if (f.anlassArt && r.anlaesse.indexOf(f.anlassArt) === -1) {
    return { grund: 'Anlass „' + f.anlassArt + '" steht nicht in der Liste',
             kriterium: 'Passende Anlässe',
             beleg: f.quelle + ', abgerufen ' + f.abruf };
  }
  return null;
}

/* Der Lauf. Einmal gerechnet, von allen Ansichten benutzt, damit zwei
   Bildschirme nie verschiedene Zahlen zeigen koennen. */
function lauf() {
  const o = b(), r = regeln();
  const ueber = zustand.ueberstimmt[zustand.betrieb];
  const auf = [], ver = [];
  o.firmen.forEach(f => {
    if (ueber.indexOf(f.firma) >= 0) { auf.push({ f: f, vonHand: true }); return; }
    const x = pruefe(f, o, r);
    if (x) ver.push(Object.assign({ f: f }, x));
    else auf.push({ f: f, vonHand: false });
  });
  return { auf: auf, ver: ver, geprueft: o.firmen.length };
}

  return `

            ${openerBlock(k)}
            <div class="beleg"><span>Anrufer ist ${e(tel().nutzer)}, ${e(tel().rolle)}. Der Einstieg nennt nie eine Person, die nicht selbst anruft.</span></div>
            <button class="knopf k-gold" data-anruf="${e(k.id)}">Anruf starten</button>

                : 'Dieser Kontakt ist Interessent. Wird er zum Kunden, genügt ein Klick, Historie und Fundort bleiben erhalten.'}
            </p>
            ${k.ebene === 'Interessent'

function ansichtAnruf() {
  const k = kontakt(zustand.kontaktId);
  if (!k) return '<p>Kein Kontakt gewählt.</p>';
  const o = b();
  const schritte = ['Einstieg', 'Einwand', 'Ergebnis'];

  let leib = '';
  if (zustand.anrufSchritt === 0) {
    leib = `
      <div class="karte-leib stapel">
        ${openerBlock(k)}
        <div class="beleg"><span>Wählformat ${e(k.telefon)}, direkte Durchwahl. Über die Zentrale ist die Trefferquote deutlich schlechter.</span></div>
        <div class="reihe">
          <button class="knopf k-gold" data-schritt="1">Gesprächspartner ist dran</button>
          <button class="knopf k-rand" data-ergebnis="nicht erreicht">Niemanden erreicht</button>
        </div>
      </div>`;
  } else if (zustand.anrufSchritt === 1) {
    /* Die Zahl wird GEZAEHLT, nie ausgeschrieben. Hier stand „die vier
       Einwaende", und sobald einer abgeschaltet wird, waere das eine
       Behauptung gegen den eigenen Bildschirm. */
    const ein = aktiveEinwaende();
    const zahlwort = ['keinen', 'einen', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht'];
    const menge = ein.length < zahlwort.length ? zahlwort[ein.length] : String(ein.length);
    leib = `
      <div class="karte-leib stapel">
        <p style="font-size:13.5px;color:var(--text-leise)">${ein.length > 0
          ? 'Der Assistent hält ' + menge + (ein.length === 1 ? ' Einwand' : ' Einwände') + ' bereit, ausgewählt unter „Assistenten anlernen".'
          : (tel().einwaende.length === 0
            ? 'Für dieses Haus ist kein Einwand hinterlegt. Unter „Assistenten anlernen" lässt sich einer aufnehmen.'
            : 'Alle ' + tel().einwaende.length + ' hinterlegten Einwände sind abgeschaltet. Unter „Assistenten anlernen" lassen sie sich wieder einschalten.')}</p>
        ${ein.map(x => `
          <div class="kasten gold">
            <div class="kasten-titel">${e(x.frage)}</div>
            <div class="kasten-text">${e(x.antwort)}</div>
          </div>`).join('')}
        <button class="knopf k-gold" data-schritt="2">Weiter zum Ergebnis</button>
      </div>`;
  } else {
    leib = `
      <div class="karte-leib stapel">
        <p style="font-size:13.5px;color:var(--text-leise)">Das Ergebnis wird als Sprachnachricht eingesprochen oder getippt. Der Assistent schreibt es in Historie und Status zurück.</p>
        <div class="feld">
          <label class="feld-label" for="ergebnis">Was ist herausgekommen</label>
          <textarea id="ergebnis" placeholder="Zum Beispiel, erreicht, Unterlagen erwünscht, Wiedervorlage in zwei Wochen">${e(zustand.anrufErgebnis)}</textarea>
        </div>
        <div class="reihe">
          <button class="knopf k-gold" data-ergebnis="erreicht">Erreicht und notiert</button>
          <button class="knopf k-rand" data-ergebnis="kein bedarf">Kein Bedarf</button>
          <button class="knopf k-rand" data-ergebnis="kunde">Hat gebucht</button>
        </div>
        <div class="kasten grau">
          <div class="kasten-titel">Was hier bewusst nicht passiert</div>
          <div class="kasten-text">
            Es ruft kein Assistent an. Ein KI-Anruf in der Kaltakquise ist ohne ausdrückliche Einwilligung nicht zulässig.
            Der Assistent bereitet vor und schreibt nach, gesprochen wird von einem Menschen.
          </div>
        </div>
      </div>`;
  }

  return `
  <section class="stapel">
    <div class="karte">
      <div class="karte-kopf">
        <h2 class="karte-titel">${e(k.person)}, ${e(k.firma)}</h2>
        <span class="pille p-grau">${e(k.rolleP)}</span>
        <button class="knopf k-still k-klein" style="margin-left:auto" data-kontakt="${e(k.id)}">Zurück zum Kontakt</button>
      </div>
      <div class="karte-leib" style="border-bottom:1px solid var(--linie)">
        <div class="schritte">
          ${schritte.map((s, i) => `
            <span class="schritt ${i === zustand.anrufSchritt ? 'aktiv' : (i < zustand.anrufSchritt ? 'fertig' : '')}">${i < zustand.anrufSchritt ? '✓' : (i + 1)} ${e(s)}</span>`).join('')}
        </div>
      </div>
      ${leib}
    </div>
  </section>`;
}

function ansichtAnlernen() {
  const o = b(), r = regeln(), t = tel();
  const L = lauf(), S = standardLauf();
  /* Beide Haelften zaehlen zum Stand. Nur die Selektion zu vergleichen
     hiesse „Standard" anzuzeigen, waehrend der Einstieg umgeschrieben
     ist, und der Knopf zum Zuruecksetzen bliebe gesperrt. */
  const zielGeaendert = JSON.stringify(r) !== JSON.stringify(o.regeln);
  const telGeaendert = JSON.stringify(t) !== JSON.stringify(telefonKopie(o.schluessel));
  /* Ein angefangener Einwand zaehlt mit. Sonst steht „Standard" ueber
     einem Bildschirm, in dem etwas Getipptes steht, und der Knopf zum
     Zuruecksetzen bleibt gesperrt, obwohl es etwas zurueckzusetzen gibt. */
  const entwurf = neuEinwand();
  const entwurfGeaendert = !!(entwurf.frage || entwurf.antwort);
  const geaendert = zielGeaendert || telGeaendert || entwurfGeaendert;
  const einAktiv = aktiveEinwaende().length;
  const alleAnlaesse = [];
  o.firmen.forEach(f => { if (f.anlassArt && alleAnlaesse.indexOf(f.anlassArt) === -1) alleAnlaesse.push(f.anlassArt); });
  o.regeln.anlaesse.forEach(a => { if (alleAnlaesse.indexOf(a) === -1) alleAnlaesse.push(a); });
  const offeneAnlaesse = alleAnlaesse.filter(a => r.anlaesse.indexOf(a) === -1);

  return `
  <section class="stapel">
    <div class="karte">
      <div class="karte-kopf">
        <h2 class="karte-titel">Was deine Einstellungen bewirken</h2>
        <span class="pille ${geaendert ? 'p-gold' : 'p-grau'}" style="margin-left:auto">${geaendert ? 'geändert' : 'Standard'}</span>
      </div>
      <div class="karte-leib stapel">
        <div class="gitter g4">
          <div class="kennzahl">
            <div class="kennzahl-label">Aufgenommen</div>
            <div class="kennzahl-wert zahl">${L.auf.length}</div>
            <div class="kennzahl-note ${L.auf.length === S.auf.length ? '' : (L.auf.length > S.auf.length ? 'gut' : 'warn')}">
              ${L.auf.length === S.auf.length ? 'wie im Standard' : (L.auf.length > S.auf.length ? '+' : '') + (L.auf.length - S.auf.length) + ' gegenüber dem Standard'}
            </div>
          </div>
          <div class="kennzahl">
            <div class="kennzahl-label">Verworfen</div>
            <div class="kennzahl-wert zahl">${L.ver.length}</div>
            <div class="kennzahl-note">von ${L.geprueft} geprüften Firmen</div>
          </div>
          <div class="kennzahl">
            <div class="kennzahl-label">Zählprobe</div>
            <div class="kennzahl-wert zahl">${L.auf.length} plus ${L.ver.length}</div>
            <div class="kennzahl-note ${L.auf.length + L.ver.length === L.geprueft ? 'gut' : 'warn'}">ergibt ${L.auf.length + L.ver.length}</div>
          </div>
          <div class="kennzahl">
            <div class="kennzahl-label">Einwände im Gespräch</div>
            <div class="kennzahl-wert zahl">${einAktiv} von ${t.einwaende.length}</div>
            <div class="kennzahl-note ${einAktiv === 0 ? 'warn' : ''}">${einAktiv === 0
              ? 'Der Anruf zeigt keinen'
              : 'stehen in Schritt zwei des Anrufs'}</div>
          </div>
        </div>
        <div class="reihe">
          <button class="knopf k-gold" data-geh="zielkunden">Ergebnis ansehen</button>
          <button class="knopf k-rand" data-zuruecksetzen="1" ${geaendert ? '' : 'disabled'}>Auf Standard zurücksetzen</button>
        </div>
      </div>
    </div>

    <div class="gitter g-haupt">
      <div class="stapel">
        <div class="karte">
          <div class="karte-kopf"><h2 class="karte-titel">Kriterien des Hauses</h2>
            <span class="pille p-gold" style="margin-left:auto">Zielkunden-Assistent</span></div>
          <div class="karte-leib stapel">
            <div class="gitter g2">
              <div class="feld">
                <label class="feld-label" for="radiusMin">Einzugsgebiet in Minuten</label>
                <input id="radiusMin" type="number" min="5" max="360" step="5" value="${r.radiusMin}" data-regel="radiusMin">
                <span class="beleg"><span>${o.firmen.filter(f => f.fahrzeit > r.radiusMin).length} von ${o.firmen.length} Firmen liegen darüber</span></span>
              </div>
              <div class="feld">
                <label class="feld-label" for="mindestGroesse">Mindestgröße in Mitarbeitenden</label>
                <input id="mindestGroesse" type="number" min="1" max="5000" step="1" value="${r.mindestGroesse}" data-regel="mindestGroesse">
                <span class="beleg"><span>${o.firmen.filter(f => f.mitarbeiter < r.mindestGroesse).length} von ${o.firmen.length} Firmen liegen darunter</span></span>
              </div>
            </div>

            <div class="schalter-zeile">
              <button class="schalter" role="switch" aria-checked="${r.obergrenzeAn}" data-schalter="obergrenzeAn" aria-label="Obergrenze bei der Firmengröße"><span class="schalter-knopf"></span></button>
              <div class="schalter-text">
                <b>Obergrenze bei der Firmengröße</b>
                <span>Standardmäßig aus. Große Häuser sind ausdrücklich erwünscht, eine Obergrenze sortiert genau die stärksten Kandidaten aus.</span>
              </div>
            </div>
            ${r.obergrenzeAn ? `
            <div class="feld" style="max-width:280px">
              <label class="feld-label" for="obergrenze">Obergrenze in Mitarbeitenden</label>
              <input id="obergrenze" type="number" min="10" max="10000" step="10" value="${r.obergrenze}" data-regel="obergrenze">
              <span class="beleg"><span>${o.firmen.filter(f => f.mitarbeiter > r.obergrenze).map(f => f.firma).join(', ') || 'Aktuell fällt keine Firma heraus'}</span></span>
            </div>` : ''}

            <div class="schalter-zeile">
              <button class="schalter" role="switch" aria-checked="${r.anlassPflicht}" data-schalter="anlassPflicht" aria-label="Ein belegter Anlass ist Pflicht"><span class="schalter-knopf"></span></button>
              <div class="schalter-text">
                <b>Ein belegter Anlass ist Pflicht</b>
                <span>Ist er aus, bleiben Firmen ohne belegten Anlass in der Liste und werden als Lücke ausgewiesen, statt still zu verschwinden.</span>
              </div>
            </div>
          </div>
        </div>

        <div class="karte">
          <div class="karte-kopf"><h2 class="karte-titel">Passende Anlässe</h2></div>
          <div class="karte-leib stapel">
            <div class="reihe">
              ${r.anlaesse.map(a => `
                <span class="marke-pille">${e(a)}
                  <button data-anlass-weg="${e(a)}" aria-label="${e(a)} entfernen">✕</button>
                </span>`).join('')}
              ${r.anlaesse.length === 0 ? '<span class="beleg"><span>Kein Anlass gesetzt, damit fällt jede Firma mit erkanntem Anlass heraus.</span></span>' : ''}
            </div>
            ${offeneAnlaesse.length ? `
            <div>
              <div class="feld-label" style="margin-bottom:6px">Wieder aufnehmen</div>
              <div class="reihe">
                ${offeneAnlaesse.map(a => `<button class="knopf k-rand k-klein" data-anlass-dazu="${e(a)}">${e(a)} hinzufügen</button>`).join('')}
              </div>
            </div>` : ''}
            <span class="beleg"><span>Der Assistent gleicht den erkannten Anlass gegen diese Liste ab. Eine Firma ohne erkannten Anlass ist davon nicht betroffen.</span></span>
          </div>
        </div>

        <div class="karte">
          <div class="karte-kopf"><h2 class="karte-titel">Ausschlusskriterien</h2></div>
          <div class="karte-leib stapel">
            ${o.schalter.map(x => {
              const trifft = o.firmen.filter(f => f.merkmale[x.schluessel]).length;
              return `
              <div class="schalter-zeile">
                <button class="schalter" role="switch" aria-checked="${!!r.schalter[x.schluessel]}" data-schalter="s:${e(x.schluessel)}" aria-label="${e(x.grund)} ausschließen"><span class="schalter-knopf"></span></button>
                <div class="schalter-text">
                  <b>${e(x.grund)}</b>
                  <span>${e(x.regel)}</span>
                  <span class="beleg"><span>${trifft === 1 ? 'Trifft auf 1 Firma zu' : 'Trifft auf ' + trifft + ' Firmen zu'}</span></span>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="stapel">
        <div class="karte">
          <div class="karte-kopf"><h2 class="karte-titel">Kriterien für das Telefonat</h2>
            <span class="pille p-lila" style="margin-left:auto">Termin-Assistent</span></div>
          <div class="karte-leib stapel">
            <div class="stapel">
              <div class="feld">
                <label class="feld-label" for="anruferName">Wer anruft</label>
                <input id="anruferName" type="text" maxlength="60" value="${e(t.nutzer)}" data-telefon="nutzer">
                <span class="beleg"><span>Steht im Einstieg, im Seitenkopf und auf der Übersicht</span></span>
              </div>
              <div class="feld">
                <label class="feld-label" for="anruferRolle">Seine Rolle im Haus</label>
                <input id="anruferRolle" type="text" maxlength="60" value="${e(t.rolle)}" data-telefon="rolle">
                <span class="beleg"><span>Der Einstieg nennt nie eine Person, die nicht selbst anruft</span></span>
              </div>
            </div>

            <div class="feld">
              <label class="feld-label" for="schlusssatz">Schlusssatz des Einstiegs</label>
              <textarea id="schlusssatz" maxlength="400" data-telefon="schluss">${e(t.schluss)}</textarea>
              <span class="beleg"><span>Steht in jedem vorgeschlagenen Einstieg, direkt vor der Frage nach dem Zeitpunkt</span></span>
            </div>

            <div>
              <div class="feld-label" style="margin-bottom:8px">Vorbereitete Einwände</div>

                <div class="schalter-zeile">

            </div>

              </div>
              <div class="feld">
                <label class="feld-label" for="neuAntwort">Was der Anrufer darauf antwortet</label>
                <input id="neuAntwort" type="text" maxlength="300" value="${e(neuEinwand().antwort)}" data-neu="antwort" placeholder="Die Antwort, die im Haus wirklich funktioniert.">
              </div>
            </div>
            <div class="reihe">
              <button class="knopf k-rand k-klein" data-einwand-neu="1">Einwand aufnehmen</button>
            </div>
            <span class="beleg"><span>Aufgenommene Einwände stehen sofort in Schritt zwei des Anrufs, in der Reihenfolge dieser Liste.</span></span>
          </div>
        </div>

        <div class="karte">
          <div class="karte-kopf"><h2 class="karte-titel">Was die Assistenten gelernt haben</h2></div>
          <div class="karte-leib stapel">
            ${o.nuggets.map((n, i) => zustand.verworfeneNuggets[zustand.betrieb].indexOf(i) >= 0 ? `
              <div class="kasten grau">
                <div class="kasten-titel">${e(n.art)}, verworfen</div>
                <div class="kasten-text">Der Assistent nutzt diesen Punkt nicht mehr.
                  <button class="knopf k-still k-klein" data-nugget-zurueck="${i}">Rückgängig</button>
                </div>
              </div>` : `
              <div class="kasten gruen">
                <div class="kasten-titel">${e(n.art)}
                  <span class="pille ${n.assistent === 'termin' ? 'p-lila' : 'p-gold'}" style="margin-left:8px">${n.assistent === 'termin' ? 'Termin-Assistent' : 'Zielkunden-Assistent'}</span>
                </div>
                <div class="kasten-text">${e(n.text)}
                  <div class="beleg" style="margin-top:6px">
                    <span>${e(n.herkunft)}</span>
                    <button class="knopf k-still k-klein" data-nugget-weg="${i}">Stimmt nicht</button>
                  </div>
                </div>
              </div>`).join('')}
          </div>
        </div>
        <div class="kasten gold">
          <div class="kasten-titel">Warum das hier steht</div>
          <div class="kasten-text">
            Gelerntes ist nur dann etwas wert, wenn es aus Gesprächen stammt und nicht aus der eigenen Eingabe.
            Deshalb trägt jeder Eintrag, woher er kommt, mit der Zahl der Fälle oder dem Zeitraum. Was nicht stimmt, wird verworfen.
          </div>
        </div>
        <div class="kasten grau">
          <div class="kasten-titel">Was hier nicht passiert</div>
          <div class="kasten-text">
            Der Prototyp speichert nichts. Beim Neuladen der Seite stehen wieder die hinterlegten Regeln.
            Im Betrieb liegen sie beim Kunden, nicht im Browser.
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

const ANSICHTEN = {
  uebersicht: { titel: 'Übersicht', kicker: 'Akquise', icon: '◱', bau: ansichtUebersicht },
  zielkunden: { titel: 'Zielkunden finden', kicker: 'Zielkunden-Assistent', icon: '⌖', bau: ansichtZielkunden },
  heute:      { titel: 'Heute anrufen', kicker: 'Termin-Assistent', icon: '☎', bau: () => ansichtKontakte(true) },
  kontakte:   { titel: 'Alle Kontakte', kicker: 'Termin-Assistent', icon: '☰', bau: () => ansichtKontakte(false) },
  kontakt:    { titel: 'Kontakt', kicker: 'Termin-Assistent', icon: '☰', bau: ansichtKontakt, versteckt: true },
  anruf:      { titel: 'Anruf', kicker: 'Termin-Assistent', icon: '☎', bau: ansichtAnruf, versteckt: true },
  anlernen:   { titel: 'Assistenten anlernen', kicker: 'Beide Assistenten', icon: '✎', bau: ansichtAnlernen }
};

function zeichne() {
  const o = b();
  const ks = kontakte();
  const a = ANSICHTEN[zustand.ansicht];
  const heuteOffen = ks.filter(k => k.heute && !k.erledigt).length;

  const punkt = (id, zahl) => {
    const x = ANSICHTEN[id];
    return `<button class="nav-punkt" data-geh="${id}" ${zustand.ansicht === id ? 'aria-current="page"' : ''}>
      <span class="nav-icon" aria-hidden="true">${x.icon}</span>${e(x.titel)}
      ${zahl ? '<span class="nav-zahl">' + zahl + '</span>' : ''}</button>`;
  };

  document.getElementById('wurzel').innerHTML = `
  <div class="app">
    <nav class="nav" aria-label="Hauptnavigation">
      <div class="marke">
        <span class="monogramm" aria-hidden="true">H</span>
        <span class="marke-text">
          <span class="marke-name">HospitalityOS</span>
          <span class="marke-sub">Akquise</span>
        </span>
      </div>
      <div class="nav-gruppe">
        <div class="nav-titel">Überblick</div>
        ${punkt('uebersicht')}
      </div>
      <div class="nav-gruppe">
        <div class="nav-titel">Zielkunden-Assistent</div>
        ${punkt('zielkunden', lauf().auf.length)}
      </div>
      <div class="nav-gruppe">
        <div class="nav-titel">Termin-Assistent</div>
        ${punkt('heute', heuteOffen)}
        ${punkt('kontakte', ks.length)}
      </div>
      <div class="nav-gruppe">
        <div class="nav-titel">Einrichtung</div>
        ${punkt('anlernen')}
      </div>
      <div class="nav-fuss">
        <div class="nav-hinweis">
          <b>Prototyp.</b> Alle Häuser, Firmen und Personen sind erfunden. Es geht um den Ablauf, nicht um Daten.
        </div>
        <div class="nutzer">
          <span class="nutzer-kreis" aria-hidden="true">${e(kuerzel(tel().nutzer))}</span>
          <span>
            <span class="nutzer-name">${e(tel().nutzer)}</span><br>
            <span class="nutzer-rolle">${e(tel().rolle)}</span>
          </span>
        </div>
      </div>
    </nav>

    <main class="inhalt">
      <header class="kopf">
        <div class="kopf-text">
          <div class="kopf-kicker">${e(a.kicker)}</div>
          <h1 class="kopf-titel">${e(a.titel)}</h1>
        </div>
        <div class="umschalter" role="group" aria-label="Betrieb wählen">
          ${Object.keys(BETRIEBE).map(s => `
            <button data-betrieb="${s}" aria-pressed="${zustand.betrieb === s}">${e(BETRIEBE[s].reiter)}</button>`).join('')}
        </div>
      </header>
      ${zustand.meldung ? '<div style="padding:12px 26px 0"><div class="kasten ' + (zustand.meldungArt === 'stop' ? 'rot' : 'gruen') + '"><div class="kasten-titel">' + (zustand.meldungArt === 'stop' ? 'Nicht übernommen' : 'Erledigt') + '</div><div class="kasten-text">' + e(zustand.meldung) + '</div></div></div>' : ''}
      <div class="bahn">${a.bau()}</div>
      <footer class="fuss">
        HospitalityOS, Zielkunden-Assistent und Termin-Assistent. Klickbarer Prototyp der DMT Group.
        Alle Häuser, Firmen, Personen und Zahlen sind erfunden.
      </footer>
    </main>
  </div>`;
}

/* ------------------------------------------------------------------
   Bedienung
   ------------------------------------------------------------------ */
document.addEventListener('click', (ev) => {
  const ziel = ev.target.closest('[data-geh],[data-betrieb],[data-kontakt],[data-anruf],[data-reiter],[data-ueberstimmen],[data-zumkunden],[data-zuminteressent],[data-schritt],[data-ergebnis],[data-schalter],[data-anlass-weg],[data-anlass-dazu],[data-zuruecksetzen],[data-nugget-weg],[data-nugget-zurueck],[data-einwand],[data-einwand-neu]');
  if (!ziel) return;
  const d = ziel.dataset;
  zustand.meldung = null;
  zustand.meldungArt = 'gut';

  if (d.geh) { zustand.ansicht = d.geh; }
  else if (d.betrieb) { zustand.betrieb = d.betrieb; zustand.ansicht = 'uebersicht'; }
  else if (d.reiter) { zustand.reiterLauf = d.reiter; }
  else if (d.kontakt) { zustand.kontaktId = d.kontakt; zustand.ansicht = 'kontakt'; }
  else if (d.anruf) { zustand.kontaktId = d.anruf; zustand.ansicht = 'anruf'; zustand.anrufSchritt = 0; zustand.anrufErgebnis = ''; }
  else if (d.schritt) {
    const feld = document.getElementById('ergebnis');
    if (feld) zustand.anrufErgebnis = feld.value;
    zustand.anrufSchritt = Number(d.schritt);
  }
  else if (d.schalter) {
    const r = regeln();
    if (d.schalter.indexOf('s:') === 0) {
      const k = d.schalter.slice(2);
      r.schalter[k] = !r.schalter[k];
    } else {
      r[d.schalter] = !r[d.schalter];
    }
  }
  else if (d.anlassWeg) {
    const r = regeln();
    r.anlaesse = r.anlaesse.filter(a => a !== d.anlassWeg);
  }
  else if (d.anlassDazu) {
    regeln().anlaesse.push(d.anlassDazu);
  }
  else if (d.einwand) {
    const x = tel().einwaende[Number(d.einwand)];
    if (x) x.aktiv = !x.aktiv;
  }
  else if (d.einwandNeu) {
    /* Die Felder werden VOR dem Neuzeichnen gelesen, sonst ist die
       Eingabe weg, bevor sie im Zustand ankommt. Dieselbe Reihenfolge
       wie beim Ergebnisfeld im Anruf. */
    const ff = document.getElementById('neuFrage');
    const fa = document.getElementById('neuAntwort');
    const frage = ff ? ff.value.trim() : '';
    const antwort = fa ? fa.value.trim() : '';
    if (!frage || !antwort) {
      zustand.neuEinwand[zustand.betrieb] = { frage: frage, antwort: antwort };
      zustand.meldungArt = 'stop';
      zustand.meldung = 'Ein Einwand braucht beides, den Satz des Angerufenen und die Antwort darauf. '
        + 'Ohne Antwort stünde im Anruf eine Frage ohne Erwiderung.';
    } else {
      tel().einwaende.push({ frage: frage, antwort: antwort, aktiv: true, eigen: true });
      zustand.neuEinwand[zustand.betrieb] = { frage: '', antwort: '' };
      zustand.meldung = 'Der Einwand steht jetzt in Schritt zwei des Anrufs, an letzter Stelle.';
    }
  }
  else if (d.zuruecksetzen) {
    zustand.regeln[zustand.betrieb] = JSON.parse(JSON.stringify(b().regeln));
    zustand.telefon[zustand.betrieb] = telefonKopie(zustand.betrieb);
    const hatteEntwurf = !!(neuEinwand().frage || neuEinwand().antwort);
    zustand.neuEinwand[zustand.betrieb] = { frage: '', antwort: '' };
    zustand.meldung = 'Selektion und Telefonat stehen wieder auf dem hinterlegten Stand. Überstimmte Firmen bleiben davon unberührt.'
      + (hatteEntwurf ? ' Der angefangene Einwand wurde dabei verworfen.' : '');
  }
  else if (d.nuggetWeg) {
    zustand.verworfeneNuggets[zustand.betrieb].push(Number(d.nuggetWeg));
  }
  else if (d.nuggetZurueck) {
    const v = zustand.verworfeneNuggets[zustand.betrieb];
    v.splice(v.indexOf(Number(d.nuggetZurueck)), 1);
  }
  else if (d.ueberstimmen) {
    zustand.ueberstimmt[zustand.betrieb].push(d.ueberstimmen);
    zustand.meldung = d.ueberstimmen + ' ist jetzt in der Liste. Die Entscheidung des Assistenten wurde überstimmt und der Grund bleibt nachlesbar.';
  }
  else if (d.zumkunden) {
    aendere(d.zumkunden, 'ebene', 'Kunde');
    aendere(d.zumkunden, 'status', 'lila');
    zustand.meldung = 'Aus dem Interessenten ist ein Kunde geworden. Historie und Fundort sind unverändert erhalten.';
  }
  else if (d.zuminteressent) {
    aendere(d.zuminteressent, 'ebene', 'Interessent');
    aendere(d.zuminteressent, 'status', 'hellgruen');
    zustand.meldung = 'Der Kontakt steht wieder auf Interessent.';
  }
  else if (d.ergebnis) {
    const k = kontakt(zustand.kontaktId);
    const feld = document.getElementById('ergebnis');
    const notiz = feld && feld.value.trim() ? feld.value.trim() : null;
    const heute = '18.08.2026';
    let text, status = 'hellgruen';

    if (d.ergebnis === 'nicht erreicht') { text = notiz || 'Niemanden erreicht'; status = 'hellgruen'; }
    else if (d.ergebnis === 'kein bedarf') { text = notiz || 'Erreicht, aktuell kein Bedarf'; status = 'grau'; }
    else if (d.ergebnis === 'kunde') { text = notiz || 'Erreicht, Veranstaltung gebucht'; status = 'lila'; }
    else { text = notiz || 'Erreicht, Unterlagen erwünscht'; status = 'hellgruen'; }

    const neueHistorie = k.historie.concat([{ datum: heute, text: text }]);
    aendere(k.id, 'historie', neueHistorie);
    aendere(k.id, 'status', status);
    aendere(k.id, 'erledigt', true);
    if (d.ergebnis === 'kunde') aendere(k.id, 'ebene', 'Kunde');

    zustand.ansicht = 'heute';
    zustand.meldung = 'Ergebnis in Historie und Status zurückgeschrieben, ' + text + '.';
  }

  merkeAdresse();
  zeichne();
  window.scrollTo(0, 0);
});

/* Zahlenfelder lösen bei `change` aus, nicht bei `input`. Bei jedem
   Tastendruck neu zu zeichnen wuerde den Schreibfokus zerstoeren,
   sobald die erste Ziffer getippt ist. */
/* Die beiden Felder fuer einen neuen Einwand wandern bei jedem
   Tastendruck in den Zustand, ohne neu zu zeichnen. Sonst waere die
   Eingabe weg, sobald daneben etwas anderes ein Neuzeichnen ausloest. */
document.addEventListener('input', (ev) => {
  const el = ev.target.closest('[data-neu]');
  if (!el) return;
  neuEinwand()[el.dataset.neu] = el.value;
});

/* Anrufer, Rolle und Schlusssatz. Sie wirken sofort im Einstieg, deshalb
   wird neu gezeichnet, und der Schreibfokus kehrt danach in dasselbe
   Feld zurueck. */
document.addEventListener('change', (ev) => {
  const t = ev.target.closest('[data-telefon]');
  if (t) {
    const wert = t.value.trim();
    if (!wert) { zeichne(); return; }
    tel()[t.dataset.telefon] = wert;
    zustand.meldung = null;
    merkeAdresse();
    zeichne();
    const wieder = document.querySelector('[data-telefon="' + t.dataset.telefon + '"]');
    if (wieder) { wieder.focus(); wieder.setSelectionRange(wieder.value.length, wieder.value.length); }
    return;
  }
  const el = ev.target.closest('[data-regel]');
  if (!el) return;
  const r = regeln();
  const wert = Number(el.value);
  if (!isFinite(wert) || wert <= 0) { zeichne(); return; }
  r[el.dataset.regel] = wert;
  zustand.meldung = null;
  merkeAdresse();
  zeichne();
});

/* ------------------------------------------------------------------
   Adresse je Ansicht.
   Jede Ansicht ist direkt aufrufbar, `#tagung/kontakte` oder
   `#gruppe/zielkunden`. Zwei Gruende. Der Empfaenger kann eine
   bestimmte Ansicht weiterschicken, und jede Ansicht laesst sich
   einzeln pruefen, ohne sich durch Klicks zu hangeln.
   ------------------------------------------------------------------ */
function merkeAdresse() {
  const teile = [zustand.betrieb, zustand.ansicht];
  if (zustand.ansicht === 'zielkunden' && zustand.reiterLauf === 'verworfen') teile.push('verworfen');
  if ((zustand.ansicht === 'kontakt' || zustand.ansicht === 'anruf') && zustand.kontaktId) teile.push(zustand.kontaktId);
  history.replaceState(null, '', '#' + teile.join('/'));
}

function leseAdresse() {
  const roh = (location.hash || '').replace(/^#/, '');
  if (!roh) return;
  const teile = roh.split('/').filter(Boolean);
  if (teile.length && BETRIEBE[teile[0]]) { zustand.betrieb = teile.shift(); }
  if (teile.length && ANSICHTEN[teile[0]]) { zustand.ansicht = teile.shift(); }
  if (zustand.ansicht === 'zielkunden') {
    zustand.reiterLauf = teile[0] === 'verworfen' ? 'verworfen' : 'aufgenommen';
  }
  if (zustand.ansicht === 'kontakt' || zustand.ansicht === 'anruf') {
    const ks = kontakte();
    const treffer = ks.find(k => k.id === teile[0]);
    zustand.kontaktId = treffer ? treffer.id : ks[0].id;
  }
}

leseAdresse();
merkeAdresse();
zeichne();
</script>
